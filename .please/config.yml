schema_version: 7   # from hooks/lib/workspace-defaults.ts; do not edit manually

language: en   # Output language (ko | en)

# GitHub integration (optional)
# github:
#   project: 5              # GitHub Project number (from URL: /orgs/{org}/projects/5)
#   owner: {org_name}       # GitHub org or user owning the project
#   issue_required: true     # Deprecated and ignored: /please:new-track always creates the Issue

# Workflow policies
# `workflow.stacked_pr.tool` is the single source of truth for which CLI drives the stack.
workflow:
  stacked_pr:
    enabled: true                  # Use stacked PR workflow (one PR per branch in stack)
    tool: gh-stack                 # gh-stack | git-spice | none
    split_phases: true             # If plan.md has `### Phase N:` headings, create a stacked branch per phase
    branch_prefix: tracks/         # Branch prefix (single-phase: tracks/{track_id}; multi-phase: tracks/{track_id}-phase-N-{slug})

# Document path overrides (optional — defaults shown)
docs:
  tracks: .please/docs/tracks
  product-specs: docs/specs
  decisions: docs/adr
  investigations: .please/docs/investigations
  research: .please/docs/research
  references: docs/references
  knowledge: docs/knowledge
  brainstorms: .please/docs/brainstorms
  ideation: .please/docs/ideation
  review: .please/docs/review

# Review plugin settings (/review:setup)
review:
  in-house:
    enabled: true
  builtin:
    enabled: true
  cubic:
    enabled: true
    default-flags: "--json -b"
  agy:
    enabled: false
  coderabbit:
    enabled: false
  greptile:
    enabled: false
  gemini:
    enabled: true
    max-reviews-per-pr: 3
